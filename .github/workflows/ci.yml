name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install package and optional review integration
        run: python -m pip install -e '.[review]'
      - name: Run offline contracts
        run: python -B -m unittest discover -s tests -v
      - name: Verify example sources CSV matches JSON
        run: python -B scripts/sources_from_csv.py --csv config/sources.example.csv --out config/sources.example.json --check
      - name: Validate configured sources and check live board URLs
        run: |
          if [ -f sources.csv ]; then
            python -B scripts/sources_from_csv.py --check --check-live
          elif [ -f sources.json ]; then
            python -B -c "import json; from pathlib import Path; from job_monitor.monitor import validate_sources; from job_monitor.sources_csv import check_live_sources; cfg = json.loads(Path('sources.json').read_text()); validate_sources(cfg); failures = check_live_sources(cfg); print('\n'.join(f'{b}: {e}' for b, e in failures)); raise SystemExit(1 if failures else 0)"
          else
            echo "No sources.csv or sources.json committed; skipping live board check"
          fi
