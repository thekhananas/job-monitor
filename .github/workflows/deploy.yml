name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.DEPLOY_TARGET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -B -m unittest discover -s tests -v
      - name: Validate sources before deploy
        run: |
          if [ -f sources.csv ]; then
            python -B scripts/sources_from_csv.py --check --check-live
          fi
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "Missing DEPLOY_SSH_KEY or DEPLOY_KNOWN_HOSTS secret" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Verify SSH connection
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: ssh -v -o BatchMode=yes -o ConnectTimeout=10 "$DEPLOY_TARGET" "echo ok"
      - name: Deploy to VM
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          if [ -f sources.json ] && [ -f profile.json ]; then
            bash deployment/deploy.sh "$DEPLOY_TARGET" --update-config
          else
            bash deployment/deploy.sh "$DEPLOY_TARGET"
          fi
